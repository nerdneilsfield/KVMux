name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-debug
          - os: ubuntu-24.04
            preset: linux-debug
          - os: windows-2022
            preset: windows-debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ffmpeg
      - name: Install host dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libavcodec-dev libavutil-dev libswscale-dev libgl1-mesa-dev
      - name: Install host dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y ninja ffmpeg
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libavcodec-dev libavutil-dev libswscale-dev libgl1-mesa-dev
      - run: cmake --preset linux-sanitizers
      - run: cmake --build --preset linux-sanitizers --parallel
      - run: ctest --preset linux-sanitizers --output-on-failure
