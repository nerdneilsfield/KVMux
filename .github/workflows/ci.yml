name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-debug
          - os: ubuntu-24.04
            preset: linux-debug
          - os: windows-2022
            preset: windows-debug
          - os: windows-2022
            preset: windows-debug-headless
          - os: ubuntu-24.04
            preset: linux-debug-headless
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ffmpeg pkg-config libusb
      - name: Install host dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libusb-1.0-0-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install host dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y ninja
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-full_build-shared.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'e4a40b46e3a3f3e5f2ed28352bd1fd6c733ae3808a8743682ef7f0d4e20c7d51') {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $ffmpeg = Join-Path $env:RUNNER_TEMP 'ffmpeg-8.0.1-full_build-shared'
          "CMAKE_PREFIX_PATH=$ffmpeg" >> $env:GITHUB_ENV
          "$ffmpeg/bin" >> $env:GITHUB_PATH
      - name: Install libusb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'libusb-1.0.27.7z'
          Invoke-WebRequest 'https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z' -OutFile $bin
          if ((Get-FileHash $bin -Algorithm SHA256).Hash -ne '19835e290f46fab6bd8ce4be6ab7dc5209f1c04bad177065df485e51dc4118c8') {
            throw 'libusb Windows archive checksum mismatch'
          }
          $src = Join-Path $env:RUNNER_TEMP 'libusb-1.0.27.tar.bz2'
          Invoke-WebRequest 'https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2' -OutFile $src
          if ((Get-FileHash $src -Algorithm SHA256).Hash -ne 'ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575') {
            throw 'libusb source archive checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'libusb-1.0.27-windows'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { throw '7-Zip is required to extract libusb-1.0.27.7z' }
          & $seven x $bin "-o$root" -y
          if ($LASTEXITCODE -ne 0) { throw 'libusb archive extraction failed' }
          $srcDir = Join-Path $env:RUNNER_TEMP 'libusb-src'
          New-Item -ItemType Directory -Force -Path $srcDir | Out-Null
          tar -xjf $src -C $srcDir
          if ($LASTEXITCODE -ne 0) { throw 'libusb source extraction failed' }
          Copy-Item (Join-Path $srcDir 'libusb-1.0.27\COPYING') (Join-Path $root 'COPYING')
          "LIBUSB_ROOT=$root" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: Install Windows runtime
        if: runner.os == 'Windows'
        run: cmake --install build/${{ matrix.preset }} --prefix stage
      - name: Check installed Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Avoid letting the SDK PATH hide missing DLLs in the installed tree.
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          & ./stage/bin/kvmux-relay.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed relay failed to start' }
          if (Test-Path ./stage/bin/kvmux.exe) {
            & ./stage/bin/kvmux.exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Installed GUI executable failed to load' }
          }
      - name: Install Linux runtime
        if: runner.os == 'Linux'
        run: |
          cmake --install build/${{ matrix.preset }} --prefix stage
          stage/bin/kvmux-relay --help
          if [ -x stage/bin/kvmux ]; then stage/bin/kvmux --help; fi
  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libusb-1.0-0-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev
      - run: cmake --preset linux-sanitizers
      - run: cmake --build --preset linux-sanitizers --parallel
      - run: ctest --preset linux-sanitizers --output-on-failure
